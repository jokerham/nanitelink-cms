version: 1
backend:
  phases:
    build:
      commands:
        - nvm use 22
        - npm install --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID"
frontend:
  phases:
    build:
      commands:
        - nvm use 22
        - test -s amplify_outputs.json
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
